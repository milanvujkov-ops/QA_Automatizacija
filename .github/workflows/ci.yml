name: CI Tests

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kod
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalacija Firefox pretraživača
        uses: browser-actions/setup-firefox@v1

      - name: Instalacija biblioteka
        run: |
          python -m pip install --upgrade pip
          pip install --force-reinstall --no-cache-dir -r requirements.txt

      - name: Pokretanje testova
        env:
          BASE_URL: https://httpbin.org
          TEST_USER: milan_admin
          TEST_ROLE: admin
        run: python -m pytest tests/ --html=report.html --self-contained-html