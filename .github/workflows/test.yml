name: QA Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Preuzimanje koda sa GitHub-a
      uses: actions/checkout@v3

    - name: Podešavanje Python okruženja
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # OVO DODAJEMO DA INSTALIRA CHROME NA LINUX MAŠINI:
    - name: Instalacija Google Chrome-a
      uses: browser-actions/setup-chrome@v1

    - name: Instalacija zavisnosti (dependencies)
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-html selenium webdriver-manager

    - name: Pokretanje Pytest testova u Headless modu
      run: |
        python -m pytest --html=report.html --self-contained-html